<title>Controle de Kits Natalinos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: faixa bordô com a marca + abas (desktop) / barra inferior (celular); conteúdo em coluna que abre em grade larga. Paleta da marca Clealco: bordô, vermelho, amarelo-cana, laranja e creme. */
:root{
  --bg:#fbf7ea; --surface:#ffffff; --ink:#2a1a14; --muted:#76625a; --line:#ebe0c6;
  --band:#780e14; --band-ink:#fcf6d6; --band-muted:#e9c9b4;
  --brand:#780e14; --brand-ink:#ffffff; --brand-soft:#f6e4e1;
  --red:#d21a21; --yellow:#fcca0c; --yellow-soft:#fdf1c2; --orange:#c86708; --orange-soft:#fde6cf;
  --ok:#2f7d4f; --ok-soft:#e1f1e6; --bad:#c4161d; --bad-soft:#fbe1e1;
  --f-display:"Barlow Semi Condensed","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Barlow",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:.625rem;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18110f; --surface:#221816; --ink:#f6ede5; --muted:#b9a69c; --line:#3a2a25;
  --band:#2c0b0e; --band-ink:#fcf6d6; --band-muted:#c9a99a;
  --brand:#fcca0c; --brand-ink:#2a1a14; --brand-soft:#3a2a12;
  --red:#ff6a6f; --yellow:#fcca0c; --yellow-soft:#3a2f10; --orange:#f8a24e; --orange-soft:#3a2615;
  --ok:#7cc79a; --ok-soft:#183026; --bad:#ff7a7f; --bad-soft:#3a1c1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18110f; --surface:#221816; --ink:#f6ede5; --muted:#b9a69c; --line:#3a2a25;
  --band:#2c0b0e; --band-ink:#fcf6d6; --band-muted:#c9a99a;
  --brand:#fcca0c; --brand-ink:#2a1a14; --brand-soft:#3a2a12;
  --red:#ff6a6f; --yellow:#fcca0c; --yellow-soft:#3a2f10; --orange:#f8a24e; --orange-soft:#3a2615;
  --ok:#7cc79a; --ok-soft:#183026; --bad:#ff7a7f; --bad-soft:#3a1c1e; color-scheme:dark}
html{font-size:16px}
html[data-fs="p"]{font-size:14px} html[data-fs="g"]{font-size:18px} html[data-fs="gg"]{font-size:20px}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:1rem/1.5 var(--f-body);margin:0;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
.wrap{max-width:74rem;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--band);color:var(--band-ink);box-shadow:inset 0 -.25rem 0 var(--yellow)}
.bar{display:flex;align-items:center;gap:.75rem;padding-block:.7rem}
.brand{font:800 1.3rem/1 var(--f-display);letter-spacing:.01em;display:flex;align-items:center;gap:.55rem;white-space:nowrap}
.brand svg{width:1.6rem;height:1.6rem;flex:none}
.brand small{display:block;font:600 .7rem/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--band-muted)}
.who{margin-left:auto;display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--band-muted);min-width:0}
.who .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.who b{color:var(--band-ink);font-weight:600}
.hbtn{background:transparent;color:var(--band-ink);border:1px solid color-mix(in srgb,var(--band-ink) 35%,transparent);border-radius:.5rem;padding:.35rem .6rem;font:600 .85rem var(--f-body);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.hbtn:hover{background:color-mix(in srgb,var(--band-ink) 12%,transparent)}
nav.tabs{display:flex;gap:.15rem;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:.25rem solid transparent;padding:.55rem .8rem .7rem;font:600 .95rem var(--f-body);color:var(--band-muted);cursor:pointer;margin-bottom:0}
nav.tabs button:hover{color:var(--band-ink)}
nav.tabs button[aria-current="true"]{color:var(--band-ink);border-bottom-color:var(--yellow)}
nav.bottom{display:none}
main{padding-block:1.4rem 4rem;display:grid;gap:1.25rem}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.75rem;font-weight:800}
h2{font-size:1.2rem;font-weight:700}
.sub{color:var(--muted);font-size:.85rem;margin:.15rem 0 0}
.grid2{display:grid;gap:1.25rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,26rem),1fr));align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:grid;gap:.9rem;min-width:0}
.kpis{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,10rem),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.75rem .9rem;border-top:.25rem solid var(--yellow)}
.kpi:nth-child(2){border-top-color:var(--red)} .kpi:nth-child(3){border-top-color:var(--brand)} .kpi:nth-child(4){border-top-color:var(--orange)}
.kpi .l{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .v{font:800 1.9rem/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .n{font-size:.78rem;color:var(--muted)}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:.4rem .5rem;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.meter{height:.4rem;border-radius:.2rem;background:var(--yellow-soft);overflow:hidden;min-width:4rem;margin-top:.3rem}
.meter span{display:block;height:100%;background:var(--red)}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:.1rem .55rem;border-radius:99px;white-space:nowrap;letter-spacing:.02em}
.p-matriz{background:var(--brand-soft);color:var(--brand)}
.p-filial{background:var(--orange-soft);color:var(--orange)}
.p-entrega,.p-entregue{background:var(--ok-soft);color:var(--ok)}
.p-transf{background:var(--orange-soft);color:var(--orange)}
.p-entrada{background:var(--yellow-soft);color:var(--ink)}
.p-ajuste,.p-estorno,.p-flag{background:var(--bad-soft);color:var(--bad)}
.p-off,.p-pendente{background:var(--line);color:var(--muted)}
.low{color:var(--bad)}
.mono{font-family:var(--f-mono);font-size:.82rem}
.dim{color:var(--muted)}
form{display:grid;gap:.75rem}
.row{display:grid;gap:.75rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr))}
label{display:grid;gap:.25rem;font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.02em}
input,select,textarea{font:1rem var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:.5rem;padding:.65rem .7rem;width:100%;min-width:0;min-height:2.75rem}
input[type=file]{padding:.5rem;background:var(--surface)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.btn{font:700 1rem var(--f-body);border-radius:.5rem;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:.7rem 1.1rem;cursor:pointer;justify-self:start;min-height:2.75rem}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.sm{padding:.3rem .65rem;font-size:.85rem;min-height:2.1rem}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btns{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.checks{display:grid;gap:.5rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.chk{display:flex;gap:.5rem;align-items:center;font-weight:500;color:var(--ink);font-size:.92rem;letter-spacing:0}
.chk input{width:1.15rem;height:1.15rem;min-height:0;accent-color:var(--red)}
.saldo{display:flex;align-items:baseline;gap:.5rem;padding:.6rem .75rem;border-radius:.5rem;background:var(--yellow-soft);flex-wrap:wrap}
.saldo b{font:800 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.saldo.zero{background:var(--bad-soft);color:var(--bad)}
.info{font-size:.88rem;padding:.55rem .7rem;border-radius:.5rem;background:var(--ok-soft);color:var(--ok)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.alert{padding:.6rem .75rem;border-radius:.5rem;background:var(--bad-soft);color:var(--bad);font-size:.9rem}
.feed{display:grid}
.feed .it{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;padding:.55rem 0;border-bottom:1px solid var(--line);min-width:0}
.feed .it:last-child{border-bottom:0}
.feed .t{min-width:0;font-size:.92rem;overflow-wrap:anywhere}
.feed .t small{display:block;color:var(--muted);font-size:.78rem}
.feed .q{font:800 1.05rem var(--f-display);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.9rem;padding:.9rem;border:1px dashed var(--line);border-radius:.5rem;text-align:center}
.center{min-height:80vh;display:grid;place-items:center;padding-block:2rem}
.login{width:min(100%,24rem)}
.loginhead{background:var(--band);color:var(--band-ink);margin:-1rem -1rem 0;padding:1.1rem 1rem;border-radius:var(--r) var(--r) 0 0;box-shadow:inset 0 -.25rem 0 var(--yellow);display:flex;align-items:center;justify-content:space-between;gap:.5rem}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(1rem + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.5rem;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.subtabs{display:flex;gap:.4rem;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:.4rem .9rem;font:600 .85rem var(--f-body);cursor:pointer}
.subtabs button[aria-current="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.progress{height:.5rem;border-radius:.25rem;background:var(--yellow-soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--red);transition:width .2s}
/* Aparência */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:20}
.sheet{position:fixed;z-index:21;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 3.6rem);width:min(22rem,calc(100% - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);padding:1rem;display:grid;gap:.9rem;box-shadow:0 .75rem 2rem rgb(0 0 0 / .2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:.5rem;overflow:hidden}
.seg button{background:var(--surface);color:var(--ink);border:0;border-left:1px solid var(--line);padding:.55rem .3rem;font:600 .9rem var(--f-body);cursor:pointer;min-height:2.6rem}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.sheet .list{display:grid;gap:.25rem}
.sheet .list button,.sheet .list a{display:flex;align-items:center;gap:.6rem;background:none;border:0;padding:.7rem .4rem;font:600 1rem var(--f-body);color:var(--ink);text-align:left;cursor:pointer;border-radius:.4rem;text-decoration:none}
.sheet .list button:hover{background:var(--bg)}
.ic{width:1.25rem;height:1.25rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ----- Celular ----- */
@media (max-width:760px){
  nav.tabs{display:none}
  .who .nm,.who .hide-m{display:none}
  main{padding-block:1rem calc(5.5rem + env(safe-area-inset-bottom,0px))}
  h1{font-size:1.45rem}
  nav.bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:0 -.25rem 1rem rgb(0 0 0 / .06)}
  nav.bottom button{background:none;border:0;display:grid;justify-items:center;gap:.15rem;padding:.5rem .1rem .45rem;font:600 .7rem var(--f-body);color:var(--muted);cursor:pointer;border-top:.2rem solid transparent;min-height:3.6rem}
  nav.bottom button[aria-current="true"]{color:var(--brand);border-top-color:var(--red)}
  nav.bottom .ic{width:1.45rem;height:1.45rem}
  .sheet.bottomsheet{top:auto;bottom:0;left:0;right:0;width:auto;border-radius:var(--r) var(--r) 0 0;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .panel{padding:.85rem}
  .btn:not(.sm){width:100%;justify-self:stretch}
  .btns .btn:not(.sm){width:auto;flex:1}
  /* tabelas viram cartões */
  table.rsp thead{display:none}
  table.rsp,table.rsp tbody,table.rsp tr,table.rsp td{display:block;width:100%}
  table.rsp tr{border:1px solid var(--line);border-radius:.5rem;padding:.35rem .7rem;margin-bottom:.6rem;background:var(--surface)}
  table.rsp td{border:0;padding:.3rem 0;display:flex;justify-content:space-between;gap:.75rem;text-align:right}
  table.rsp td::before{content:attr(data-l);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left;flex:none}
  table.rsp td.first{display:block;text-align:left;font-weight:600;border-bottom:1px solid var(--line);padding-bottom:.45rem;margin-bottom:.15rem}
  table.rsp td.first::before{content:none}
  table.rsp td:empty{display:none}
  .tbl{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div class="wrap center"><div class="login panel"><div class="loginhead"><div class="brand">Kits Natalinos</div></div><p class="note" id="bootmsg">Conectando ao banco compartilhado…</p></div></div>
</div>
<div id="toast" hidden></div>
<div id="sheetHost"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(() => {
const MANUAL_URL='https://claude.ai/artifact/4nYN6kKm1GcFhhLrHBHBDS';
const PERMS=[
  ['painel','Ver painel em tempo real'],
  ['entregar','Registrar entregas'],
  ['transferir','Transferir estoque entre pontos'],
  ['estoque','Lançar entrada e ajuste de estoque'],
  ['estornar','Estornar entregas'],
  ['historico','Ver histórico completo'],
  ['colaboradores','Importar e gerenciar lista de colaboradores'],
  ['pontos','Cadastrar pontos de entrega'],
  ['usuarios','Cadastrar usuários'],
  ['perfis','Cadastrar níveis de acesso'],
  ['todosLocais','Operar em qualquer ponto (não só o seu)'],
];
const DEFAULT_PERFIS={
  admin:{nome:'Administrador',permissoes:Object.fromEntries(PERMS.map(p=>[p[0],true]))},
  coordenacao:{nome:'Coordenação',permissoes:{painel:true,transferir:true,estoque:true,estornar:true,historico:true,colaboradores:true,todosLocais:true}},
  entregador:{nome:'Entregador',permissoes:{entregar:true}},
};
const TIPOS={entrada:'Entrada',entrega:'Entrega',transf:'Transferência',ajuste:'Ajuste',estorno:'Estorno'};
const IC={
  painel:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  entregar:'<path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  transferir:'<path d="M4 8h14l-4-4M20 16H6l4 4"/>',
  estoque:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 15h6"/>',
  colaboradores:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.2 6-5.2s5.4 1.8 6 5.2"/><path d="M16 4.8a3.2 3.2 0 010 6.4M18.5 14.8c1.4.8 2.2 2.6 2.5 5.2"/>',
  historico:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  cadastros:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  mais:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
  manual:'<path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4z"/><path d="M5 16a4 4 0 014-4h10"/>',
  sair:'<path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/>',
};
const icon=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]||''}</svg>`;
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="11" width="24" height="17" rx="2" fill="var(--red)"/><rect x="14" y="11" width="4" height="17" fill="var(--yellow)"/><rect x="2.5" y="8" width="27" height="5" rx="1.5" fill="var(--red)" stroke="var(--band)" stroke-width="1"/><rect x="14" y="8" width="4" height="5" fill="var(--yellow)"/><path d="M16 8c-2-5-8-5-7-2 .6 1.8 4.5 2 7 2zm0 0c2-5 8-5 7-2-.6 1.8-4.5 2-7 2z" fill="none" stroke="var(--yellow)" stroke-width="1.8"/></svg>`;

const S={auth:null,unsubs:[],setupInProgress:false,bootstrapped:null,db:null,user:null,platId:null,readOnly:false,me:null,view:null,sub:'pontos',
  locais:new Map(),usuarios:new Map(),perfis:new Map(),colabs:new Map(),movs:[],
  loaded:{l:false,u:false,p:false,m:false,c:false},editing:null};

const $=(s,r=document)=>r.querySelector(s);
const h=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Number(n||0).toLocaleString('pt-BR');
const fmtD=ts=>ts?new Date(ts).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
const slug=s=>norm(s).replace(/[^a-z0-9._-]/g,'');
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3400)}
function store(kind,k,v){try{const st=kind==='s'?sessionStorage:localStorage;if(v===undefined)return st.getItem(k);if(v===null)st.removeItem(k);else st.setItem(k,v)}catch(e){return null}}

// ---------- aparência (por aparelho) ----------
const hostTheme=document.documentElement.getAttribute('data-theme');
const PREF={tema:store('l','kits_tema')||'auto',fs:store('l','kits_fs')||'m'};
function applyPrefs(){
  const r=document.documentElement;
  if(PREF.tema==='claro')r.setAttribute('data-theme','light');
  else if(PREF.tema==='escuro')r.setAttribute('data-theme','dark');
  else if(hostTheme)r.setAttribute('data-theme',hostTheme);else r.removeAttribute('data-theme');
  if(PREF.fs==='m')r.removeAttribute('data-fs');else r.setAttribute('data-fs',PREF.fs);
}
applyPrefs();
function closeSheet(){$('#sheetHost').innerHTML=''}
function openSheet(html,bottom){
  $('#sheetHost').innerHTML=`<div class="sheet-bg" id="shBg"></div><div class="sheet ${bottom?'bottomsheet':''}" role="dialog" aria-modal="true">${html}</div>`;
  $('#shBg').onclick=closeSheet;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
function aparenciaHTML(){
  const seg=(key,opts)=>`<div class="seg" role="group">${opts.map(([v,t])=>`<button type="button" data-k="${key}" data-v="${v}" aria-pressed="${PREF[key]===v}">${t}</button>`).join('')}</div>`;

   <div style="display:grid;gap:.35rem"><span class="note"><b>Tema</b></span>${seg('tema',[['auto','Automático'],['claro','Claro'],['escuro','Escuro']])}</div>

const enc=s=>new TextEncoder().encode(s);
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){const key=await crypto.subtle.importKey('raw',enc(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc(salt),iterations:120000,hash:'SHA-256'},key,256))}
const newSalt=()=>hex(crypto.getRandomValues(new Uint8Array(16)));

function can(p,u=S.me){if(u&&u.perfilId==='admin')return true;const pf=perfilOf(u);return !!(pf&&pf.permissoes&&pf.permissoes[p])}
function locaisPermitidos(){

// ---------- cálculos (livro-razão) ----------
function entregasPorMat(){const m=new Map();for(const x of S.movs)if(x.tipo==='entrega'&&!x.estornado&&x.matricula)m.set(slug(x.matricula),x);return m}
function stats(){
  const L={},U={};const z=()=>({rec:0,ent:0,tin:0,tout:0,aj:0,saldo:0,prev:0,pend:0});
  for(const l of S.locais.values())L[l.id]=z();
  const g=id=>L[id]||(L[id]=z());let transfQtd=0,transfN=0;
  for(const m of S.movs){const q=Number(m.qtd)||0;
    if(m.tipo==='entrada'){g(m.origem).rec+=q;g(m.origem).saldo+=q}
    else if(m.tipo==='ajuste'){g(m.origem).aj+=q;g(m.origem).saldo+=q}
    else if(m.tipo==='entrega'){g(m.origem).saldo-=q;if(!m.estornado){g(m.origem).ent+=q;const u=U[m.por]||(U[m.por]={ent:0,locais:{}});u.ent+=q;u.locais[m.origem]=(u.locais[m.origem]||0)+q}}
    else if(m.tipo==='estorno'){g(m.origem).saldo+=q}
    else if(m.tipo==='transf'){g(m.origem).tout+=q;g(m.origem).saldo-=q;g(m.destino).tin+=q;g(m.destino).saldo+=q;transfQtd+=q;transfN++}}
  const ent=entregasPorMat();let atend=0;
  for(const c of S.colabs.values()){const done=ent.has(slug(c.matricula));if(done)atend++;if(c.localId){g(c.localId).prev++;if(!done)g(c.localId).pend++}}
  return {L,U,transfQtd,transfN,atend,totalColab:S.colabs.size};
}

const FIREBASE_CONFIG={apiKey:'COLE_AQUI',authDomain:'COLE_AQUI',projectId:'COLE_AQUI',storageBucket:'COLE_AQUI',messagingSenderId:'COLE_AQUI',appId:'COLE_AQUI'};

function saveFile(filename,data){
  const type=filename.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'text/csv;charset=utf-8';
  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1500);
}
function authMsg(err){
  const c=(err&&err.code)||'';
  if(c==='auth/email-already-in-use')return 'Esse login já existe.';
  if(['auth/wrong-password','auth/user-not-found','auth/invalid-credential','auth/invalid-login-credentials'].includes(c))return 'Login ou senha incorretos.';
  if(c==='auth/weak-password')return 'A senha precisa ter ao menos 6 caracteres.';
  if(c==='auth/too-many-requests')return 'Muitas tentativas. Aguarde alguns minutos.';
  if(c==='auth/network-request-failed')return 'Sem conexão. Verifique a internet.';
  return null;
}
function stopData(){S.unsubs.forEach(f=>{try{f()}catch(e){}});S.unsubs=[];S.loaded={l:false,u:false,p:false,m:false,c:false};}
function startData(){
  if(S.unsubs.length)return;
  const db=S.db;
  const sub=(col,key,fn)=>{
    const un=db.collection(col).onSnapshot(snap=>{fn(snap);S.loaded[key]=true;schedule()},()=>{if(S.me)toast('Conexão perdida com o banco. Recarregue a página.')});
    S.unsubs.push(un);
  };
  const toMap=s=>new Map(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));
  sub('locais','l',s=>S.locais=toMap(s));
  sub('usuarios','u',s=>S.usuarios=toMap(s));
  sub('perfis','p',s=>S.perfis=toMap(s));
  sub('colaboradores','c',s=>S.colabs=toMap(s));
  sub('movimentos','m',s=>{S.movs=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts)});
}
let rafPending=false;
function schedule(){if(rafPending)return;rafPending=true;requestAnimationFrame(()=>{rafPending=false;refresh()})}

let lastScreen=null;
async function boot(){
  if(!window.firebase||!configOk()){$('#bootmsg').textContent='Falta preencher a configuração do Firebase no arquivo. Veja docs/FIREBASE.md.';return}
  firebase.initializeApp(FIREBASE_CONFIG);
  S.auth=firebase.auth();S.db=firebase.firestore();
  try{const b=await S.db.doc('config/bootstrap').get();S.bootstrapped=b.exists}
  catch(e){$('#bootmsg').textContent='Não consegui falar com o banco. Confira a configuração do Firebase e as regras.';return}
  S.auth.onAuthStateChanged(async u=>{
    if(S.setupInProgress)return;
    if(!u){stopData();S.me=null;route();return}
    try{
      const d=await S.db.doc('usuarios/'+u.uid).get();
      if(!d.exists){noAccess();return}
      if(d.data().ativo===false){await S.auth.signOut();renderLogin('Usuário desativado. Fale com o administrador.');return}
      startData();
    }catch(e){noAccess('Não foi possível verificar seu acesso. Tente de novo.')}
  });
}
function route(){
  const scr=S.bootstrapped===false?'setup':'login';
  if(lastScreen===scr)return;
  lastScreen=scr;
  scr==='setup'?renderSetup():renderLogin();
}
function refresh(){
  if(!S.auth||!S.auth.currentUser)return;
  if(!Object.values(S.loaded).every(Boolean))return;
  const me=S.usuarios.get(S.auth.currentUser.uid);
  if(!me){noAccess();return}
  if(me.ativo===false){S.auth.signOut();return}
  S.me=me;
  if(lastScreen!=='app'){lastScreen='app';renderShell()}else updateDyn();
}
function logout(){if(S.auth)S.auth.signOut().catch(()=>{})}

   <section class="panel"><h2>Últimas entregas neste ponto</h2><div id="eFeed"></div></section></div>`,[()=>{
    const sel=$('#eLocal'),lp=locaisPermitidos();fillSelect(sel,locOpts(lp),lp.length>1?'Escolha o ponto':null);
    if(!sel.dataset.init){sel.dataset.init=1;if(S.me.localId&&lp.some(l=>l.id===S.me.localId))sel.value=S.me.localId}
    showSaldo();feed();lookup(false);
  }]);
  function showSaldo(){const id=$('#eLocal').value,s=id?saldoDe(id):0,b=$('#eSaldo');b.className='saldo'+(id&&s<=0?' zero':'');b.innerHTML=id?`<b>${fmtN(s)}</b> kits disponíveis em ${h(nomeLocal(id))}`:'Escolha o ponto para ver o saldo';$('#eBtn').disabled=!locaisPermitidos().length}
  function feed(){const id=$('#eLocal').value;const it=S.movs.filter(m=>m.tipo==='entrega'&&m.origem===id).slice(0,12);
    $('#eFeed').innerHTML=it.length?feedHTML(it,m=>[`<span class="pill ${m.estornado?'p-estorno':'p-entrega'}">${m.estornado?'estornada':fmtD(m.ts)}</span>`,`${h(m.colab)} <span class="mono">· ${h(m.matricula)}</span><small>por ${h(nomeUser(m.por,m.porNome))}${m.foraLista?' · fora da lista':''}</small>`,fmtN(m.qtd)]):'<div class="empty">Nenhuma entrega neste ponto ainda.</div>'}
  let lastMat='';
  function lookup(fromInput){
    const mat=$('#eMat').value.trim(),id=slug(mat),info=$('#eInfo'),force=$('#eForce');
    const c=id&&S.colabs.get('m-'+id),done=id&&entregasPorMat().get(id),local=$('#eLocal').value;
    let html='',needForce=false;
    if(done)html=`<div class="alert">Já recebeu kit em <b>${h(nomeLocal(done.origem))}</b>, entregue por <b>${h(nomeUser(done.por,done.porNome))}</b> em ${fmtD(done.ts)}.</div>`;
    else if(c){html=`<div class="info">${h(c.nome)}${c.setor?' · '+h(c.setor):''}${c.localId?' · previsto: '+h(nomeLocal(c.localId)):''}</div>`;
      if(c.localId&&local&&c.localId!==local)html+=`<div class="alert">Previsto para outro ponto (${h(nomeLocal(c.localId))}). A entrega é permitida e fica sinalizada.</div>`;
      if(fromInput&&id!==lastMat)$('#eNome').value=c.nome}
    else if(id&&S.colabs.size){html=`<div class="alert">Matrícula fora da lista importada. Confira o número.</div>`;needForce=true}
    if(fromInput)lastMat=id;
    info.innerHTML=html;force.hidden=!needForce;if(!needForce)$('#eForceChk').checked=false;
  }
  if(!locaisPermitidos().length)$('#eMsg').innerHTML='<div class="alert">Nenhum ponto liberado para você. Peça ao administrador para vincular seu usuário a um ponto.</div>';
  $('#eLocal').onchange=()=>{showSaldo();feed();lookup(false)};
  $('#eMat').oninput=()=>lookup(true);
  $('#fEnt').onsubmit=async e=>{e.preventDefault();
    const local=$('#eLocal').value,mat=$('#eMat').value.trim(),matId=slug(mat),qtd=parseInt($('#eQtd').value,10);
    const msg=t=>$('#eMsg').innerHTML=t?`<div class="alert">${t}</div>`:'';
    const c=S.colabs.get('m-'+matId);
    if(!local||!matId)return msg('Informe o ponto e uma matrícula válida.');
    if(!(qtd>0))return msg('A quantidade precisa ser maior que zero.');
    if(!c&&S.colabs.size&&!$('#eForceChk').checked)return msg('Matrícula fora da lista. Marque “Entregar mesmo assim” se a entrega estiver autorizada.');
    if(saldoDe(local)<qtd)return msg(`Saldo insuficiente em ${h(nomeLocal(local))}. Lance uma entrada ou peça uma transferência.`);
    const btn=$('#eBtn');btn.disabled=true;
    try{
      const extra={};if(!c&&S.colabs.size)extra.foraLista=true;if(c&&c.localId&&c.localId!==local)extra.foraPonto=c.localId;if(c&&c.setor)extra.setor=c.setor;
      const ts=Date.now(),movRef=S.db.collection('movimentos').doc(),ref=S.db.doc('matriculas/m-'+matId);
      const mov={tipo:'entrega',origem:local,qtd,colab:$('#eNome').value.trim(),matricula:mat,obs:$('#eObs').value.trim(),...extra,por:S.me.id,porNome:S.me.nome,porLogin:S.me.login,dev:null,ts};
      // transação: checa a matrícula e grava o movimento de forma atômica (evita entrega dupla em dois pontos)
      const clash=await S.db.runTransaction(async t=>{
        const s=await t.get(ref);
        if(s.exists)return s.data();
        t.set(movRef,mov);
        t.set(ref,{movId:movRef.id,localId:local,por:S.me.id,porNome:S.me.nome,ts,matricula:mat});
        return null;
      });
      if(clash){msg(`A matrícula <b>${h(mat)}</b> já recebeu kit em <b>${h(nomeLocal(clash.localId))}</b>, entregue por <b>${h(nomeUser(clash.por,clash.porNome))}</b> em ${fmtD(clash.ts)}.`);return}
      msg('');['eMat','eNome','eObs'].forEach(i=>$('#'+i).value='');$('#eQtd').value=1;$('#eForceChk').checked=false;lastMat='';lookup(false);$('#eMat').focus();
      toast('Entrega registrada para '+mat+'.');
    }catch(err){if(err&&err.code)handleWriteErr(err);else msg('Não foi possível registrar. Tente de novo.')}
    finally{btn.disabled=false}
  };
}

let xlsxP=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve(window.XLSX);

const COLS=[['mat','Matrícula',/matr|chapa|registro|^re$|cracha|codigo|^cod/],['nome','Nome',/nome|colaborador|funcionario/],['setor','Setor',/setor|area|depart|centro|cargo|funcao/],['ponto','Ponto de entrega',/ponto|local|unidade|filial|entrega|planta/]];
function vColab(){
  const imp=can('colaboradores');
  setView(`<div><h1>Colaboradores</h1><p class="sub">Lista de quem tem direito ao kit. Com ela, a matrícula preenche o nome e o painel mostra os pendentes.</p></div>

    <div class="row"><label for="cQ">Buscar<input id="cQ" placeholder="matrícula, nome ou setor"></label>
     <label for="cSt">Situação<select id="cSt"><option value="">Todos</option><option value="pend">Pendentes</option><option value="ok">Entregues</option></select></label>

    <div class="tbl" id="cList"></div></section>`,[()=>{

  }]);
  if(!imp){$('#cFile').closest('.panel').hidden=true}
  function list(){

    const rows=[...S.colabs.values()].filter(c=>{const done=ent.has(slug(c.matricula));

      return `<tr><td class="first">${h(c.nome)}</td>${td('Matrícula',`<span class="mono">${h(c.matricula)}</span>`)}${td('Setor',h(c.setor||'—'))}${td('Ponto previsto',h(c.localId?nomeLocal(c.localId):'—'))}
       ${td('Situação',d?`<span class="pill p-entregue">entregue ${fmtD(d.ts)}</span><div class="note">${h(nomeLocal(d.origem))} · ${h(nomeUser(d.por,d.porNome))}</div>`:'<span class="pill p-pendente">pendente</span>')}
       <td>${imp&&!d?`<button class="btn danger sm" data-rm="${h(c.id)}">Remover</button>`:''}</td></tr>`}).join('')}</tbody></table>
       ${rows.length>200?`<p class="note">Mostrando 200 de ${fmtN(rows.length)}. Use a busca ou os filtros.</p>`:''}`
      :`<div class="empty">${S.colabs.size?'Ninguém com esses filtros.':'Nenhum colaborador importado ainda. Use “Importar do Excel” ao lado.'}</div>`;
    $('#cList').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{
      if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='Confirmar';setTimeout(()=>{b.classList.remove('armed');b.textContent='Remover'},4000);return}
      try{await S.db.doc('colaboradores/'+b.dataset.rm).delete();toast('Colaborador removido da lista.')}catch(e){handleWriteErr(e)}});
  }
  ['cSt','cLoc'].forEach(i=>$('#'+i).onchange=list);$('#cQ').oninput=list;

  $('#cTpl').onclick=async()=>{
    try{const X=await loadXLSX();const ws=X.utils.aoa_to_sheet([['Matrícula','Nome','Setor','Ponto de entrega'],['104523','Maria Aparecida Souza','Indústria – Moenda',[...S.locais.values()][0]?.nome||'Matriz – Portaria 2']]);
      ws['!cols']=[{wch:12},{wch:34},{wch:24},{wch:28}];const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,'Colaboradores');
      const dl={save:async o=>saveFile(o.filename,o.data)};
      await dl.save({filename:'modelo-colaboradores-kits.xlsx',data:X.write(wb,{type:'array',bookType:'xlsx'})});
    }catch(e){if(e&&e.message==='xlsx')toast('Não foi possível carregar o leitor de Excel. Verifique a conexão.')}
  };

  let parsed=null;
  $('#cFile').onchange=async()=>{
    const f=$('#cFile').files[0];if(!f)return;$('#cMap').innerHTML='<p class="note">Lendo a planilha…</p>';
    try{const X=await loadXLSX();const wb=X.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
      const aoa=X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}).filter(r=>r.some(c=>String(c).trim()!==''));
      if(aoa.length<2){$('#cMap').innerHTML='<div class="alert">A planilha está vazia ou só tem o cabeçalho.</div>';return}
      const head=aoa[0].map(x=>String(x).trim());parsed={head,rows:aoa.slice(1),name:f.name};
      const guess={};COLS.forEach(([k,,re])=>{const i=head.findIndex(x=>re.test(norm(x)));guess[k]=i>=0&&!Object.values(guess).includes(i)?i:-1});
      $('#cMap').innerHTML=`<p class="note"><b>${h(f.name)}</b> · ${fmtN(parsed.rows.length)} linhas · aba “${h(wb.SheetNames[0])}”</p>
       <div class="row">${COLS.map(([k,t])=>`<label for="map-${k}">${t}<select id="map-${k}"><option value="-1">— não usar —</option>${head.map((x,i)=>`<option value="${i}" ${guess[k]===i?'selected':''}>${h(x||'Coluna '+(i+1))}</option>`).join('')}</select></label>`).join('')}</div>
       <label for="cDef">Ponto para quem não tiver<select id="cDef"></select></label>
       <div id="cPrev"></div><div id="cProg"></div>
       <div class="btns"><button class="btn" id="cGo">Importar</button><button class="btn ghost" id="cCancel">Cancelar</button></div>`;
      fillSelect($('#cDef'),[...S.locais.values()].filter(l=>l.ativo!==false).map(l=>({v:l.id,t:l.nome})),'Sem ponto definido');
      COLS.forEach(([k])=>$('#map-'+k).onchange=preview);$('#cDef').onchange=preview;
      $('#cCancel').onclick=()=>{parsed=null;$('#cMap').innerHTML='';$('#cFile').value=''};
      $('#cGo').onclick=runImport;preview();
    }catch(e){$('#cMap').innerHTML='<div class="alert">Não consegui ler o arquivo. Salve como .xlsx ou .csv e tente de novo.</div>'}
  };
  function build(){
    const ix=Object.fromEntries(COLS.map(([k])=>[k,parseInt($('#map-'+k).value,10)]));
    const byName=new Map([...S.locais.values()].map(l=>[norm(l.nome),l.id]));const def=$('#cDef').value||null;
    const out=new Map();let semDados=0,dup=0,pontoNao=new Set();
    for(const r of parsed.rows){
      const mat=ix.mat>=0?String(r[ix.mat]).trim():'',nome=ix.nome>=0?String(r[ix.nome]).trim():'';
      const id=slug(mat);if(!id||!nome){semDados++;continue}
      let localId=def;const pRaw=ix.ponto>=0?String(r[ix.ponto]).trim():'';
      if(pRaw){const m=byName.get(norm(pRaw));if(m)localId=m;else pontoNao.add(pRaw)}
      if(out.has(id))dup++;
      out.set(id,{matricula:mat,nome,setor:ix.setor>=0?String(r[ix.setor]).trim():'',localId,pontoPlanilha:pRaw||null});
    }
    return {ix,out,semDados,dup,pontoNao};
  }
  function preview(){
    const b=build(),arr=[...b.out.values()];const novos=arr.filter(c=>!S.colabs.has('m-'+slug(c.matricula))).length;
    let warn='';if(b.ix.mat<0||b.ix.nome<0)warn='<div class="alert">Escolha as colunas de Matrícula e Nome.</div>';
    $('#cPrev').innerHTML=`${warn}<p class="note"><b>${fmtN(arr.length)}</b> válidos (${fmtN(novos)} novos, ${fmtN(arr.length-novos)} atualizados)${b.semDados?` · ${fmtN(b.semDados)} sem matrícula ou nome, ignorados`:''}${b.dup?` · ${fmtN(b.dup)} matrículas repetidas (vale a última)`:''}</p>
     ${b.pontoNao.size?`<div class="alert">Pontos da planilha não cadastrados: ${[...b.pontoNao].slice(0,6).map(h).join(', ')}${b.pontoNao.size>6?'…':''}. Essas linhas ficam com o ponto padrão.</div>`:''}
     <div class="tbl"><table class="rsp"><thead><tr><th>Nome</th><th>Matrícula</th><th>Setor</th><th>Ponto</th></tr></thead><tbody>${arr.slice(0,5).map(c=>`<tr><td class="first">${h(c.nome)}</td>${td('Matrícula',`<span class="mono">${h(c.matricula)}</span>`)}${td('Setor',h(c.setor||'—'))}${td('Ponto',h(c.localId?nomeLocal(c.localId):'—'))}</tr>`).join('')}</tbody></table></div>`;
    $('#cGo').disabled=!arr.length||b.ix.mat<0||b.ix.nome<0;
  }
  async function runImport(){
    const b=build(),arr=[...b.out.entries()];
    if(S.colabs.size+arr.length+S.movs.length>24000){toast('A lista é grande demais para o banco deste app. Fale com o administrador.');return}
    const go=$('#cGo');go.disabled=true;$('#cCancel').disabled=true;let done=0,fail=0;
    const prog=()=>$('#cProg').innerHTML=`<div class="progress"><span style="width:${Math.round(done/arr.length*100)}%"></span></div><p class="note">${fmtN(done)} de ${fmtN(arr.length)} gravados${fail?` · ${fail} com erro`:''}</p>`;prog();
    let i=0;const ts=Date.now();
    const worker=async()=>{while(i<arr.length){const [id,c]=arr[i++];
      try{await S.db.doc('colaboradores/m-'+id).set({...c,importadoEm:ts,importadoPor:S.me.id,arquivo:parsed.name})}catch(e){fail++;if(e&&(e.code==='quota_exceeded'||e.code==='invalid_argument')){handleWriteErr(e);i=arr.length}}
      done++;if(done%10===0||done===arr.length)prog()}};
    await Promise.all(Array.from({length:8},worker));prog();
    toast(fail?`Importação concluída com ${fail} erro(s).`:`${fmtN(done)} colaboradores importados.`);
    parsed=null;$('#cFile').value='';setTimeout(()=>{if($('#cMap'))$('#cMap').innerHTML=''},1500);
  }
}

// ---------- HISTÓRICO ----------
function vHistorico(){
  setView(`<section class="panel"><div class="btns" style="justify-content:space-between;align-items:end"><div><h1>Histórico</h1><p class="sub">Todo movimento, com quem fez, onde e quando.</p></div><button class="btn ghost sm" id="hCsv">Exportar CSV</button></div>
   <div class="row"><label for="hTipo">Tipo<select id="hTipo"><option value="">Todos</option>${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}<option value="flag">Entregas sinalizadas</option></select></label>
    <label for="hLoc">Ponto<select id="hLoc"></select></label><label for="hUsr">Usuário<select id="hUsr"></select></label>
    <label for="hQ">Buscar<input id="hQ" placeholder="matrícula, nome, observação"></label></div>
   <div class="tbl" id="hTbl"></div></section>`,[()=>{
    fillSelect($('#hLoc'),[...S.locais.values()].map(l=>({v:l.id,t:l.nome})),'Todos');
    fillSelect($('#hUsr'),[...S.usuarios.values()].map(u=>({v:u.id,t:u.nome})),'Todos');tbl();
  }]);
  function filt(){const t=$('#hTipo').value,l=$('#hLoc').value,u=$('#hUsr').value,q=norm($('#hQ').value);
    return S.movs.filter(m=>(!t||(t==='flag'?(m.foraLista||m.foraPonto):m.tipo===t))&&(!l||m.origem===l||m.destino===l)&&(!u||m.por===u)&&(!q||norm([m.matricula,m.colab,m.obs,m.porLogin].join(' ')).includes(q)))}
  function tbl(){const rows=filt(),show=rows.slice(0,300);
    $('#hTbl').innerHTML=rows.length?`<table class="rsp"><thead><tr><th>Quando / tipo</th><th>Ponto</th><th>Detalhe</th><th>Usuário</th><th class="num">Qtd</th><th></th></tr></thead><tbody>${show.map(m=>`<tr>
      <td class="first"><span class="pill p-${m.estornado?'estorno':m.tipo}">${TIPOS[m.tipo]}${m.estornado?' estornada':''}</span> <span class="mono dim">${fmtD(m.ts)}</span></td>
      ${td('Ponto',h(nomeLocal(m.origem))+(m.tipo==='transf'?' → '+h(nomeLocal(m.destino)):''))}
      ${td('Detalhe',(m.tipo==='entrega'||m.tipo==='estorno'?h(m.colab)+' <span class="mono">'+h(m.matricula)+'</span>':'')+(m.foraLista?' <span class="pill p-flag">fora da lista</span>':'')+(m.foraPonto?' <span class="pill p-flag">previsto: '+h(nomeLocal(m.foraPonto))+'</span>':'')+(m.obs?'<div class="note">'+h(m.obs)+'</div>':''))}
      ${td('Usuário',h(nomeUser(m.por,m.porNome))+' <span class="mono dim">'+h(m.porLogin)+'</span>')}${td('Qtd',fmtN(m.qtd),'num')}
      <td>${m.tipo==='entrega'&&!m.estornado&&can('estornar')?`<button class="btn danger sm" data-est="${m.id}">Estornar</button>`:''}</td></tr>`).join('')}</tbody></table>
      ${rows.length>300?`<p class="note">Mostrando 300 de ${fmtN(rows.length)}. Use os filtros ou exporte o CSV.</p>`:''}`:'<div class="empty">Nenhum movimento com esses filtros.</div>';
    $('#hTbl').querySelectorAll('[data-est]').forEach(b=>b.onclick=()=>estornar(b));
  }
  ['hTipo','hLoc','hUsr'].forEach(i=>$('#'+i).onchange=tbl);$('#hQ').oninput=tbl;
  $('#hCsv').onclick=async()=>{const dl={save:async o=>saveFile(o.filename,o.data)};
    const esc=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const lines=[['Data','Tipo','Ponto','Destino','Matrícula','Colaborador','Setor','Qtd','Usuário','Login','Observação','Estornada','Sinalização'].join(';')]
      .concat(filt().map(m=>[new Date(m.ts).toLocaleString('pt-BR'),TIPOS[m.tipo],nomeLocal(m.origem),m.destino?nomeLocal(m.destino):'',m.matricula,m.colab,m.setor,m.qtd,nomeUser(m.por,m.porNome),m.porLogin,m.obs,m.estornado?'sim':'',[m.foraLista?'fora da lista':'',m.foraPonto?'previsto em '+nomeLocal(m.foraPonto):''].filter(Boolean).join(', ')].map(esc).join(';')));
    try{await dl.save({filename:'kits-natalinos-historico.csv',data:'﻿'+lines.join('\r\n')})}catch(e){}};
}
async function estornar(btn){
  if(!btn.classList.contains('armed')){btn.classList.add('armed');btn.textContent='Confirmar estorno';setTimeout(()=>{btn.classList.remove('armed');btn.textContent='Estornar'},4000);return}
  const m=S.movs.find(x=>x.id===btn.dataset.est);if(!m||m.estornado)return;btn.disabled=true;
  try{await addMov({tipo:'estorno',origem:m.origem,qtd:m.qtd,ref:m.id,matricula:m.matricula,colab:m.colab,obs:'Estorno da entrega de '+fmtD(m.ts)});
    await S.db.doc('movimentos/'+m.id).update({estornado:true,estornadoPor:S.me.id,estornadoEm:Date.now()});
    const mid=slug(m.matricula);if(mid)await S.db.doc('matriculas/m-'+mid).delete();
    toast('Entrega estornada. O kit voltou ao saldo do ponto.');}catch(e){handleWriteErr(e)}
}

// ---------- CADASTROS ----------
function vCadastros(){
  const subs=[['pontos','Pontos de entrega','pontos'],['usuarios','Usuários','usuarios'],['perfis','Níveis de acesso','perfis']].filter(s=>can(s[2]));
  if(!subs.find(s=>s[0]===S.sub))S.sub=subs[0][0];
  const head=`<div class="subtabs">${subs.map(s=>`<button data-s="${s[0]}" aria-current="${s[0]===S.sub}">${s[1]}</button>`).join('')}</div>`;
  ({pontos:cPontos,usuarios:cUsuarios,perfis:cPerfis})[S.sub](head);
  document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;S.editing=null;vCadastros()});
}
function reSub(fn,head){fn(head);document.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{S.sub=b.dataset.s;S.editing=null;vCadastros()})}
function cPontos(head){
  const ed=S.editing&&S.locais.get(S.editing);
  setView(`${head}<div class="grid2"><section class="panel"><h2>${ed?'Editar ponto':'Novo ponto de entrega'}</h2>
   <form id="fP"><label for="pNome">Nome do ponto<input id="pNome" required value="${h(ed?.nome)}" placeholder="ex.: Matriz – Portaria 2"></label>
    <div class="row"><label for="pTipo">Tipo<select id="pTipo"><option value="matriz">Matriz</option><option value="filial">Filial</option></select></label>
    <label for="pEnd">Endereço / referência<input id="pEnd" value="${h(ed?.endereco)}"></label></div>
    <div class="btns"><button class="btn">${ed?'Salvar':'Cadastrar ponto'}</button>${ed?'<button type="button" class="btn ghost" id="pCancel">Cancelar</button>':''}</div></form></section>
   <section class="panel"><h2>Pontos cadastrados</h2><div class="tbl" id="pList"></div></section></div>`,[()=>{
    const st=stats(),ls=[...S.locais.values()].sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#pList').innerHTML=ls.length?`<table class="rsp"><thead><tr><th>Ponto</th><th>Tipo</th><th class="num">Saldo</th><th></th></tr></thead><tbody>${ls.map(l=>`<tr><td class="first">${h(l.nome)}${l.endereco?'<div class="note">'+h(l.endereco)+'</div>':''}</td>${td('Tipo',`<span class="pill p-${l.ativo===false?'off':l.tipo}">${l.ativo===false?'inativo':l.tipo==='matriz'?'Matriz':'Filial'}</span>`)}${td('Saldo',fmtN(st.L[l.id]?.saldo),'num')}
      <td><div class="btns"><button class="btn ghost sm" data-ed="${l.id}">Editar</button><button class="btn ghost sm" data-tg="${l.id}">${l.ativo===false?'Ativar':'Desativar'}</button></div></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Cadastre o primeiro ponto. Ex.: Matriz – Recepção, Filial Centro.</div>';
    $('#pList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{S.editing=b.dataset.ed;reSub(cPontos,head)});
    $('#pList').querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const l=S.locais.get(b.dataset.tg);try{await S.db.doc('locais/'+l.id).update({ativo:l.ativo===false})}catch(e){handleWriteErr(e)}});
  }]);
  if(ed)$('#pTipo').value=ed.tipo;
  if($('#pCancel'))$('#pCancel').onclick=()=>{S.editing=null;reSub(cPontos,head)};
  $('#fP').onsubmit=async e=>{e.preventDefault();const data={nome:$('#pNome').value.trim(),tipo:$('#pTipo').value,endereco:$('#pEnd').value.trim()};
    try{if(ed)await S.db.doc('locais/'+ed.id).update(data);else await S.db.collection('locais').add({...data,ativo:true,criadoEm:Date.now(),criadoPor:S.me.id});
      toast(ed?'Ponto atualizado.':'Ponto cadastrado.');S.editing=null;reSub(cPontos,head)}catch(err){handleWriteErr(err)}};
}
function cUsuarios(head){
  const ed=S.editing&&S.usuarios.get(S.editing);
  setView(`${head}<div class="grid2"><section class="panel"><h2>${ed?'Editar '+h(ed.nome):'Novo usuário'}</h2>
   <form id="fU"><div class="row"><label for="uNome">Nome<input id="uNome" required value="${h(ed?.nome)}"></label>
    <label for="uLogin">Login<input id="uLogin" required value="${h(ed?.login)}" ${ed?'disabled':''} autocomplete="off" autocapitalize="none" placeholder="ex.: joao.souza"></label></div>
    <div class="row"><label for="uPerfil">Nível de acesso<select id="uPerfil" required></select></label><label for="uLocal">Ponto de atuação<select id="uLocal"></select></label></div>
    ${ed?'<p class="note">A senha não é trocada por aqui. Veja docs/FIREBASE.md (seção Senhas).</p>':'<label for="uSenha">Senha inicial (mín. 6)<input id="uSenha" type="password" minlength="6" required autocomplete="new-password"></label>'}
    <div id="uMsg"></div><div class="btns"><button class="btn">${ed?'Salvar':'Criar usuário'}</button>${ed?'<button type="button" class="btn ghost" id="uCancel">Cancelar</button>':''}</div></form></section>
   <section class="panel"><h2>Usuários</h2><div class="tbl" id="uList"></div></section></div>`,[()=>{
    fillSelect($('#uPerfil'),[...S.perfis.values()].map(p=>({v:p.id,t:p.nome})),'Escolha o nível');
    fillSelect($('#uLocal'),[...S.locais.values()].filter(l=>l.ativo!==false).map(l=>({v:l.id,t:l.nome})),'Nenhum (todos, se o nível permitir)');
    const st=stats(),us=[...S.usuarios.values()].sort((a,b)=>a.nome.localeCompare(b.nome));
    $('#uList').innerHTML=`<table class="rsp"><thead><tr><th>Usuário</th><th>Nível</th><th>Ponto</th><th class="num">Entregas</th><th></th></tr></thead><tbody>${us.map(u=>`<tr><td class="first">${h(u.nome)} <span class="mono dim">${h(u.login)}</span></td>
      ${td('Nível',u.ativo===false?'<span class="pill p-off">inativo</span>':h(S.perfis.get(u.perfilId)?.nome||'—'))}${td('Ponto',h(u.localId?nomeLocal(u.localId):'—'))}${td('Entregas',fmtN(st.U[u.id]?.ent),'num')}
      <td><div class="btns"><button class="btn ghost sm" data-ed="${u.id}">Editar</button>${u.id!==S.me.id?`<button class="btn ghost sm" data-tg="${u.id}">${u.ativo===false?'Ativar':'Desativar'}</button>`:''}</div></td></tr>`).join('')}</tbody></table>`;
    $('#uList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{S.editing=b.dataset.ed;reSub(cUsuarios,head)});
    $('#uList').querySelectorAll('[data-tg]').forEach(b=>b.onclick=async()=>{const u=S.usuarios.get(b.dataset.tg);try{await S.db.doc('usuarios/'+u.id).update({ativo:u.ativo===false})}catch(e){handleWriteErr(e)}});
  }]);
  if(ed){$('#uPerfil').value=ed.perfilId||'';$('#uLocal').value=ed.localId||''}
  if($('#uCancel'))$('#uCancel').onclick=()=>{S.editing=null;reSub(cUsuarios,head)};
  $('#fU').onsubmit=async e=>{e.preventDefault();const msg=t=>$('#uMsg').innerHTML=t?`<div class="alert">${t}</div>`:'';
    const data={nome:$('#uNome').value.trim(),perfilId:$('#uPerfil').value,localId:$('#uLocal').value||null};
    if(!data.perfilId)return msg('Escolha o nível de acesso.');
    if(ed&&ed.id===S.me.id&&data.perfilId!=='admin'&&!S.perfis.get(data.perfilId)?.permissoes?.usuarios)return msg('Você não pode tirar de si mesmo o acesso a usuários.');
    const btn=e.target.querySelector('button');btn.disabled=true;
    try{
      if(ed){await S.db.doc('usuarios/'+ed.id).update(data);toast('Usuário atualizado.')}
      else{
        const login=slug($('#uLogin').value),pw=$('#uSenha').value;
        if(login.length<3)return msg('Login precisa ter ao menos 3 letras ou números.');
        if([...S.usuarios.values()].some(u=>u.login===login))return msg('Esse login já existe.');
        if(pw.length<6)return msg('A senha precisa ter ao menos 6 caracteres.');
        // cria a conta de acesso numa instância secundária, sem trocar a sessão do administrador
        const sec=firebase.initializeApp(FIREBASE_CONFIG,'sec-'+Date.now());
        let uid;
        try{const cred=await sec.auth().createUserWithEmailAndPassword(loginToEmail(login),pw);uid=cred.user.uid;await sec.auth().signOut()}
        finally{await sec.delete()}
        await S.db.doc('usuarios/'+uid).set({...data,login,uid,ativo:true,criadoEm:Date.now(),criadoPor:S.me.id});
        toast('Usuário '+login+' criado.');
      }
      S.editing=null;reSub(cUsuarios,head);
    }catch(err){const m=authMsg(err);if(m)msg(m);else handleWriteErr(err)}
    finally{btn.disabled=false}
  };
}
function cPerfis(head){
  const ed=S.editing&&S.perfis.get(S.editing);
  setView(`${head}<div class="grid2"><section class="panel"><h2>${ed?'Editar nível':'Novo nível de acesso'}</h2>
   <form id="fR"><label for="rNome">Nome do nível<input id="rNome" required value="${h(ed?.nome)}" placeholder="ex.: Supervisor de filial"></label>
    ${ed&&ed.id==='admin'?'<p class="note">O nível Administrador sempre tem todas as permissões.</p>':''}
    <div class="checks">${PERMS.map(([k,t])=>`<label class="chk"><input type="checkbox" id="perm-${k}" ${ed?.permissoes?.[k]||ed?.id==='admin'?'checked':''} ${ed?.id==='admin'?'disabled':''}>${t}</label>`).join('')}</div>
    <div id="rMsg"></div><div class="btns"><button class="btn">${ed?'Salvar':'Criar nível'}</button>${ed?'<button type="button" class="btn ghost" id="rCancel">Cancelar</button>':''}</div></form></section>
   <section class="panel"><h2>Níveis cadastrados</h2><div class="tbl" id="rList"></div></section></div>`,[()=>{
    const cnt={};S.usuarios.forEach(u=>cnt[u.perfilId]=(cnt[u.perfilId]||0)+1);
    $('#rList').innerHTML=`<table class="rsp"><thead><tr><th>Nível</th><th>Permissões</th><th class="num">Usuários</th><th></th></tr></thead><tbody>${[...S.perfis.values()].map(p=>`<tr><td class="first">${h(p.nome)}</td>${td('Permissões','<span class="note">'+(p.id==='admin'?'todas':PERMS.filter(x=>p.permissoes?.[x[0]]).map(x=>x[1]).join(' · ')||'nenhuma')+'</span>')}${td('Usuários',cnt[p.id]||0,'num')}<td><button class="btn ghost sm" data-ed="${p.id}">Editar</button></td></tr>`).join('')}</tbody></table>`;
    $('#rList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>{S.editing=b.dataset.ed;reSub(cPerfis,head)});
  }]);
  if($('#rCancel'))$('#rCancel').onclick=()=>{S.editing=null;reSub(cPerfis,head)};
  $('#fR').onsubmit=async e=>{e.preventDefault();
    const permissoes=Object.fromEntries(PERMS.map(([k])=>[k,ed?.id==='admin'?true:$('#perm-'+k).checked]));
    if(ed&&ed.id===S.me.perfilId&&!permissoes.perfis){$('#rMsg').innerHTML='<div class="alert">Você não pode remover do seu próprio nível o acesso a níveis.</div>';return}
    try{if(ed)await S.db.doc('perfis/'+ed.id).set({nome:$('#rNome').value.trim(),permissoes});else await S.db.collection('perfis').add({nome:$('#rNome').value.trim(),permissoes});
      toast('Nível salvo.');S.editing=null;reSub(cPerfis,head)}catch(err){handleWriteErr(err)}};
}

boot();
})();
</script>
